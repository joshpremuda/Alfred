services:
  openclaw:
    build: .
    image: alfred-openclaw:latest
    container_name: alfred-openclaw
    restart: unless-stopped
    working_dir: /app
    environment:
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - OPENCLAW_AGENT_NAME=${OPENCLAW_AGENT_NAME:-Alfred}
      - OPENCLAW_OWNER_ID=${OPENCLAW_OWNER_ID:-}
    volumes:
      - openclaw-data:/app/.openclaw
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:18789:18789"
    networks:
      - alfred-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    tmpfs:
      - /tmp

  webchat:
    build: ./webchat
    image: alfred-webchat:latest
    container_name: alfred-webchat
    restart: unless-stopped
    environment:
      - OPENCLAW_WS=ws://openclaw:18789
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - openclaw
    networks:
      - alfred-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  openclaw-data:
    driver: local

networks:
  alfred-net:
    driver: bridge
    internal: false
