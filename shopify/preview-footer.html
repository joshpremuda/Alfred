<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smalley Coffee — The Global Cafe | Footer Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', serif;
      background: #f0ebe4;
    }

    /* Fake page content above footer */
    .page-stub {
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0ebe4;
      color: #7a6e64;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    :root {
      --cafe-footer-bg: #f5f0e8;
      --cafe-footer-text: #0f0d0a;
      --cafe-footer-muted: #6a6258;
      --cafe-footer-accent: #0f0d0a;
      --cafe-footer-rule: #0f0d0a;
    }

    .cafe-footer {
      background: var(--cafe-footer-bg);
      color: var(--cafe-footer-text);
      overflow: hidden;
      position: relative;
    }

    .cafe-footer__content {
      position: relative;
      z-index: 2;
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 48px 40px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto auto;
      align-items: start;
      gap: 40px 24px;
    }

    .cafe-footer__brand   { grid-column: 1; grid-row: 1; }
    .cafe-footer__social  { grid-column: 2; grid-row: 1; justify-self: center; align-self: center; }
    .cafe-footer__nav     { grid-column: 3; grid-row: 1; justify-self: end; }
    .cafe-footer__legal   { grid-column: 1 / -1; grid-row: 2; }

    .cafe-footer__wordmark {
      display: inline-block;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--cafe-footer-text);
      text-decoration: none;
      font-family: 'Georgia', serif;
      border-top: 3px solid var(--cafe-footer-rule);
      border-bottom: 1px solid var(--cafe-footer-rule);
      padding: 4px 0;
      line-height: 1.1;
    }

    .cafe-footer__tagline {
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--cafe-footer-muted);
      max-width: 220px;
      line-height: 1.5;
      font-family: 'Georgia', serif;
      font-style: italic;
      letter-spacing: 0.02em;
    }

    .cafe-footer__social {
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .cafe-footer__social a {
      color: var(--cafe-footer-text);
      text-decoration: none;
      transition: color 0.2s, transform 0.2s;
      display: flex;
      align-items: center;
    }
    .cafe-footer__social a:hover {
      color: var(--cafe-footer-accent);
      transform: translateY(-2px);
    }

    .cafe-footer__nav {
      display: flex;
      gap: 48px;
      font-family: -apple-system, sans-serif;
    }
    .cafe-footer__nav-col ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .cafe-footer__nav-heading {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cafe-footer-text);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--cafe-footer-rule);
      font-family: 'Georgia', serif;
    }
    .cafe-footer__nav-col a {
      font-size: 0.85rem;
      color: var(--cafe-footer-text);
      text-decoration: none;
      font-family: 'Georgia', serif;
      transition: opacity 0.2s;
    }
    .cafe-footer__nav-col a:hover { opacity: 0.5; }

    .cafe-footer__legal {
      display: flex;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 2px solid var(--cafe-footer-rule);
      font-size: 0.72rem;
      color: var(--cafe-footer-muted);
      font-family: 'Georgia', serif;
      letter-spacing: 0.04em;
    }

    /* ── Scene ── */
    .cafe-footer__scene {
      position: relative;
      width: 100%;
      height: clamp(280px, 40vw, 560px);
      overflow: hidden;
    }
    .cafe-footer__scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
      filter: sepia(18%) saturate(90%);
    }
    .cafe-scene-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .cafe-footer__scene-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        #f5f0e8 0%,
        rgba(245,240,232,0.5) 18%,
        transparent 38%
      );
      pointer-events: none;
    }
  </style>
</head>
