<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smalley Coffee — Footer Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', serif;
      background: #f0ebe4;
    }

    /* Fake page content above footer */
    .page-stub {
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0ebe4;
      color: #7a6e64;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    :root {
      --cafe-footer-bg: #faf8f4;
      --cafe-footer-text: #1a1410;
      --cafe-footer-muted: #7a6e64;
      --cafe-footer-accent: #8b5e3c;
    }

    .cafe-footer {
      background: var(--cafe-footer-bg);
      color: var(--cafe-footer-text);
      overflow: hidden;
      position: relative;
    }

    .cafe-footer__content {
      position: relative;
      z-index: 2;
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 48px 40px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto auto;
      align-items: start;
      gap: 40px 24px;
    }

    .cafe-footer__brand   { grid-column: 1; grid-row: 1; }
    .cafe-footer__social  { grid-column: 2; grid-row: 1; justify-self: center; align-self: center; }
    .cafe-footer__nav     { grid-column: 3; grid-row: 1; justify-self: end; }
    .cafe-footer__legal   { grid-column: 1 / -1; grid-row: 2; }

    .cafe-footer__wordmark {
      display: inline-block;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--cafe-footer-text);
      text-decoration: none;
      font-family: 'Georgia', serif;
    }

    .cafe-footer__tagline {
      margin-top: 10px;
      font-size: 0.83rem;
      color: var(--cafe-footer-muted);
      max-width: 240px;
      line-height: 1.6;
      font-family: -apple-system, sans-serif;
    }

    .cafe-footer__social {
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .cafe-footer__social a {
      color: var(--cafe-footer-text);
      text-decoration: none;
      transition: color 0.2s, transform 0.2s;
      display: flex;
      align-items: center;
    }
    .cafe-footer__social a:hover {
      color: var(--cafe-footer-accent);
      transform: translateY(-2px);
    }

    .cafe-footer__nav {
      display: flex;
      gap: 48px;
      font-family: -apple-system, sans-serif;
    }
    .cafe-footer__nav-col ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .cafe-footer__nav-heading {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cafe-footer-muted);
      margin-bottom: 13px;
    }
    .cafe-footer__nav-col a {
      font-size: 0.88rem;
      color: var(--cafe-footer-text);
      text-decoration: none;
      transition: color 0.2s;
    }
    .cafe-footer__nav-col a:hover { color: var(--cafe-footer-accent); }

    .cafe-footer__legal {
      display: flex;
      justify-content: space-between;
      padding-top: 24px;
      border-top: 1px solid rgba(0,0,0,0.08);
      font-size: 0.76rem;
      color: var(--cafe-footer-muted);
      font-family: -apple-system, sans-serif;
    }

    /* ── Scene ── */
    .cafe-footer__scene {
      position: relative;
      width: 100%;
      height: clamp(280px, 40vw, 560px);
      overflow: hidden;
    }
    .cafe-footer__scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
      filter: sepia(18%) saturate(90%);
    }
    .cafe-footer__scene-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        var(--cafe-footer-bg) 0%,
        rgba(250,248,244,0.4) 22%,
        transparent 45%
      );
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="page-stub">— page content above —</div>

  <footer class="cafe-footer">
    <div class="cafe-footer__content">

      <!-- Brand -->
      <div class="cafe-footer__brand">
        <a href="#" class="cafe-footer__wordmark">Smalley Coffee</a>
        <p class="cafe-footer__tagline">Specialty coffee roasted in small batches.</p>
      </div>

      <!-- Social -->
      <nav class="cafe-footer__social" aria-label="Social media">
        <!-- Instagram -->
        <a href="#" aria-label="Instagram">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/></svg>
        </a>
        <!-- TikTok -->
        <a href="#" aria-label="TikTok">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.34 6.34 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V9a8.16 8.16 0 0 0 4.77 1.52V7.07a4.85 4.85 0 0 1-1-.38z"/></svg>
        </a>
        <!-- X -->
        <a href="#" aria-label="X">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
        <!-- Facebook -->
        <a href="#" aria-label="Facebook">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
        </a>
      </nav>

      <!-- Nav -->
      <nav class="cafe-footer__nav" aria-label="Footer navigation">
        <div class="cafe-footer__nav-col">
          <p class="cafe-footer__nav-heading">Shop</p>
          <ul>
            <li><a href="#">Whole Bean</a></li>
            <li><a href="#">Ground Coffee</a></li>
            <li><a href="#">Subscriptions</a></li>
            <li><a href="#">Merchandise</a></li>
          </ul>
        </div>
        <div class="cafe-footer__nav-col">
          <p class="cafe-footer__nav-heading">Company</p>
          <ul>
            <li><a href="#">Our Story</a></li>
            <li><a href="#">Sourcing</a></li>
            <li><a href="#">Find Us</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </div>
      </nav>

      <!-- Legal -->
      <div class="cafe-footer__legal">
        <p>© 2025 Smalley Coffee. All rights reserved.</p>
        <p><a href="#" style="color:inherit;text-decoration:none;">Privacy Policy</a> &nbsp;·&nbsp; <a href="#" style="color:inherit;text-decoration:none;">Terms of Service</a></p>
      </div>

    </div>

    <!-- Cafe scene: Renoir's "Le Moulin de la Galette" — public domain -->
    <div class="cafe-footer__scene">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/Auguste_Renoir_-_Dance_at_Le_Moulin_de_la_Galette_-_Mus%C3%A9e_d%27Orsay_RF_2739_%281876%29.jpg/2560px-Auguste_Renoir_-_Dance_at_Le_Moulin_de_la_Galette_-_Mus%C3%A9e_d%27Orsay_RF_2739_%281876%29.jpg"
        alt=""
        loading="lazy"
      >
      <div class="cafe-footer__scene-fade"></div>
    </div>
  </footer>

</body>
</html>
