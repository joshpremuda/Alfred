<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alfred — Personal Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header h1 { font-size: 16px; font-weight: 600; flex: 1; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e; flex-shrink: 0;
    }
    .status-dot.offline { background: #ef4444; }
    #status-text { font-size: 12px; color: #666; }

    .layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Chat pane ── */
    .chat-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 75%;
      padding: 9px 13px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user  { align-self: flex-end; background: #2563eb; color: #fff; }
    .msg.agent { align-self: flex-start; background: #1e1e1e; border: 1px solid #2a2a2a; }
    .msg.system { align-self: center; font-size: 12px; color: #555; background: none; }
    form {
      display: flex;
      gap: 8px;
      padding: 14px 20px;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
    }
    input[type=text] {
      flex: 1;
      padding: 9px 13px;
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 14px;
      outline: none;
    }
    input[type=text]:focus { border-color: #2563eb; }
    button.send-btn {
      padding: 9px 18px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    button.send-btn:hover { background: #1d4ed8; }
    button.send-btn:disabled { background: #374151; cursor: default; }

    /* ── Thought stream sidebar ── */
    .thought-pane {
      width: 300px;
      flex-shrink: 0;
      border-left: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      background: #111;
    }
    .thought-pane-header {
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #888;
      letter-spacing: .06em;
      text-transform: uppercase;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .thought-count {
      background: #1e3a5f;
      color: #60a5fa;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
    }
    .thought-search {
      padding: 8px 12px;
      border-bottom: 1px solid #1e1e1e;
    }
    .thought-search input {
      width: 100%;
      padding: 6px 10px;
      background: #0f0f0f;
      border: 1px solid #222;
      border-radius: 6px;
      color: #ccc;
      font-size: 12px;
      outline: none;
    }
    .thought-search input:focus { border-color: #2563eb; }
    #thought-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .thought-card {
      margin: 4px 8px;
      padding: 9px 11px;
      background: #1a1a1a;
      border: 1px solid #252525;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .thought-card:hover { border-color: #3b4e6a; }
    .thought-card.actioned { opacity: .55; }
    .thought-card.archived { opacity: .35; }
    .thought-text {
      font-size: 12px;
      line-height: 1.45;
      color: #ddd;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .thought-meta {
      margin-top: 5px;
      font-size: 10px;
      color: #555;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .thought-tag {
      background: #1e3a5f;
      color: #60a5fa;
      border-radius: 4px;
      padding: 1px 5px;
    }
    .thought-status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      display: inline-block; margin-right: 3px; vertical-align: middle;
    }
    .thought-status-dot.raw      { background: #f59e0b; }
    .thought-status-dot.actioned { background: #22c55e; }
    .thought-status-dot.archived { background: #4b5563; }

    /* Modal for thought detail */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      max-width: 480px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal h3 { font-size: 14px; margin-bottom: 10px; }
    .modal pre {
      font-size: 13px;
      white-space: pre-wrap;
      color: #ccc;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .modal-meta { font-size: 11px; color: #666; margin-bottom: 12px; }
    .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .modal-btn {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #222;
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
    }
    .modal-btn:hover { background: #2a2a2a; }
    .modal-btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .modal-btn.close-btn { margin-left: auto; }

    @media (max-width: 640px) {
      .thought-pane { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="status-dot offline" id="dot"></div>
    <h1>Alfred</h1>
    <span id="status-text">Connecting…</span>
  </header>

  <div class="layout">
    <!-- Chat -->
    <div class="chat-pane">
      <div id="messages">
        <div class="msg system">Alfred is starting up. Say hello — or just speak a thought.</div>
      </div>
      <form id="form">
        <input id="input" type="text" placeholder="Message Alfred or capture a thought…" autocomplete="off" disabled />
        <button type="submit" class="send-btn" id="send" disabled>Send</button>
      </form>
    </div>

    <!-- Thought stream -->
    <div class="thought-pane">
      <div class="thought-pane-header">
        Thought Stream
        <span class="thought-count" id="thought-count">0</span>
      </div>
      <div class="thought-search">
        <input type="text" id="thought-search" placeholder="Search thoughts…" />
      </div>
      <div id="thought-list"></div>
    </div>
  </div>

  <!-- Thought detail modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <h3 id="modal-date"></h3>
      <pre id="modal-content"></pre>
      <div class="modal-meta" id="modal-meta"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <script>
    // ── State ──
    let allThoughts = [];
    let activeThought = null;

    // ── DOM refs ──
    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('input');
    const sendBtn    = document.getElementById('send');
    const dot        = document.getElementById('dot');
    const statusText = document.getElementById('status-text');
    const thoughtList = document.getElementById('thought-list');
    const thoughtCount = document.getElementById('thought-count');
    const thoughtSearch = document.getElementById('thought-search');
    const modalOverlay = document.getElementById('modal-overlay');

    // ── Chat helpers ──
    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setOnline(online) {
      dot.className = 'status-dot' + (online ? '' : ' offline');
      statusText.textContent = online ? 'Online' : 'Connecting…';
      inputEl.disabled = !online;
      sendBtn.disabled = !online;
    }

    // ── Thought helpers ──
    function upsertThought(t) {
      const idx = allThoughts.findIndex(x => x.id === t.id);
      if (idx >= 0) allThoughts[idx] = t;
      else allThoughts.unshift(t);
      renderThoughts();
    }

    function renderThoughts(filter) {
      const q = (filter ?? thoughtSearch.value).toLowerCase();
      const visible = allThoughts.filter(t =>
        !q ||
        t.content.toLowerCase().includes(q) ||
        t.tags.some(tag => tag.toLowerCase().includes(q))
      );
      thoughtCount.textContent = allThoughts.length;
      thoughtList.innerHTML = '';
      for (const t of visible) {
        const card = document.createElement('div');
        card.className = 'thought-card ' + t.status;
        card.innerHTML = `
          <div class="thought-text">${escHtml(t.content)}</div>
          <div class="thought-meta">
            <span><span class="thought-status-dot ${t.status}"></span>${t.status}</span>
            <span>${t.timestamp.slice(0,10)}</span>
            ${t.tags.map(tag => `<span class="thought-tag">${escHtml(tag)}</span>`).join('')}
          </div>`;
        card.addEventListener('click', () => openModal(t));
        thoughtList.appendChild(card);
      }
    }

    function openModal(t) {
      activeThought = t;
      document.getElementById('modal-date').textContent = new Date(t.timestamp).toLocaleString();
      document.getElementById('modal-content').textContent = t.content;
      document.getElementById('modal-meta').textContent =
        `Source: ${t.source} | Status: ${t.status}` +
        (t.tags.length ? ` | Tags: ${t.tags.join(', ')}` : '');

      const actions = document.getElementById('modal-actions');
      actions.innerHTML = '';

      if (t.status === 'raw') {
        const actBtn = document.createElement('button');
        actBtn.className = 'modal-btn primary';
        actBtn.textContent = 'Mark actioned';
        actBtn.onclick = () => patchThought(t.id, { status: 'actioned' });
        actions.appendChild(actBtn);
      }
      if (t.status !== 'archived') {
        const archBtn = document.createElement('button');
        archBtn.className = 'modal-btn';
        archBtn.textContent = 'Archive';
        archBtn.onclick = () => patchThought(t.id, { status: 'archived' });
        actions.appendChild(archBtn);
      }
      const closeBtn = document.createElement('button');
      closeBtn.className = 'modal-btn close-btn';
      closeBtn.textContent = 'Close';
      closeBtn.onclick = closeModal;
      actions.appendChild(closeBtn);

      modalOverlay.classList.add('open');
    }

    function closeModal() {
      modalOverlay.classList.remove('open');
      activeThought = null;
    }

    async function patchThought(id, patch) {
      const res = await fetch(`/api/thoughts/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patch),
      });
      const t = await res.json();
      upsertThought(t);
      closeModal();
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    thoughtSearch.addEventListener('input', () => renderThoughts());
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

    // ── WebSocket ──
    let ws;
    function connect() {
      ws = new WebSocket('ws://' + location.host);
      ws.onopen = () => setOnline(true);

      ws.onmessage = (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch { return; }

        if (msg.type === 'thoughts_init') {
          allThoughts = msg.thoughts;
          renderThoughts();
          return;
        }
        if (msg.type === 'thought_captured' || msg.type === 'thought_updated') {
          upsertThought(msg.thought);
          return;
        }
        // Chat message
        addMessage(msg.text || JSON.stringify(msg), msg.role || 'agent');
      };

      ws.onclose = () => { setOnline(false); setTimeout(connect, 3000); };
      ws.onerror = () => ws.close();
    }

    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      addMessage(text, 'user');
      ws.send(JSON.stringify({ type: 'message', text }));
      inputEl.value = '';
    });

    connect();
  </script>
</body>
</html>
