<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alfred — Personal Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }
    .status-dot.offline { background: #ef4444; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
    }
    .msg.agent {
      align-self: flex-start;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
    }
    .msg.system {
      align-self: center;
      font-size: 12px;
      color: #666;
      background: none;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 16px 24px;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #2563eb; }
    button {
      padding: 10px 20px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #374151; cursor: default; }
  </style>
</head>
<body>
  <header>
    <div class="status-dot offline" id="dot"></div>
    <h1>Alfred</h1>
    <span id="status-text" style="font-size:12px;color:#666">Connecting…</span>
  </header>
  <div id="messages">
    <div class="msg system">Alfred is starting up. Say hello!</div>
  </div>
  <form id="form">
    <input id="input" type="text" placeholder="Message Alfred…" autocomplete="off" disabled />
    <button type="submit" id="send" disabled>Send</button>
  </form>

  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('status-text');

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function setOnline(online) {
      dot.className = 'status-dot' + (online ? '' : ' offline');
      statusText.textContent = online ? 'Online' : 'Connecting…';
      input.disabled = !online;
      send.disabled = !online;
    }

    let ws;
    function connect() {
      ws = new WebSocket('ws://' + location.host);

      ws.onopen = () => setOnline(true);

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          const text = msg.text || msg.content || msg.message || JSON.stringify(msg);
          addMessage(text, 'agent');
        } catch {
          addMessage(e.data, 'agent');
        }
      };

      ws.onclose = () => {
        setOnline(false);
        setTimeout(connect, 3000);
      };

      ws.onerror = () => ws.close();
    }

    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      addMessage(text, 'user');
      ws.send(JSON.stringify({ type: 'message', text }));
      input.value = '';
    });

    connect();
  </script>
</body>
</html>
