<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 554" width="100%" style="max-width:800px;display:block;">
  <defs>
    <style>
      .s1 { animation: sr 2.6s ease-in infinite 0s;   transform-origin: 198px 118px; }
      .s2 { animation: sr 2.6s ease-in infinite 0.8s; transform-origin: 210px 118px; }
      .s3 { animation: sr 2.6s ease-in infinite 1.6s; transform-origin: 222px 118px; }
      @keyframes sr {
        0%   { opacity: 0.75; transform: translateY(0)    scaleX(1);   }
        35%  { opacity: 0.5;  transform: translateY(-16px) scaleX(1.5); }
        70%  { opacity: 0.2;  transform: translateY(-30px) scaleX(0.8); }
        100% { opacity: 0;    transform: translateY(-42px) scaleX(1.3); }
      }
      .cs1 { animation: sr 2s ease-in infinite 0.4s; transform-origin: 352px 290px; }
      .cs2 { animation: sr 2s ease-in infinite 1.1s; transform-origin: 362px 290px; }
      .ba { animation: arm 2.2s ease-in-out infinite; transform-origin: 176px 292px; }
      @keyframes arm {
        0%, 100% { transform: rotate(-10deg); }
        50%       { transform: rotate(16deg); }
      }
      .ma { animation: sip 3.8s ease-in-out infinite; transform-origin: 295px 390px; }
      @keyframes sip {
        0%, 55%, 100% { transform: rotate(0deg); }
        32%            { transform: rotate(-32deg); }
      }
      .wa { animation: wave 2.1s ease-in-out infinite; transform-origin: 434px 280px; }
      @keyframes wave {
        0%, 100% { transform: rotate(-22deg); }
        50%       { transform: rotate(18deg); }
      }
      .eb  { animation: blink 4.2s ease-in-out infinite 0s;   transform-origin: center; }
      .eb2 { animation: blink 4.2s ease-in-out infinite 1.4s; transform-origin: center; }
      .eb3 { animation: blink 4.2s ease-in-out infinite 2.8s; transform-origin: center; }
      @keyframes blink {
        0%, 87%, 100% { transform: scaleY(1); }
        92%            { transform: scaleY(0.07); }
      }
      .bg { animation: bob 3.2s ease-in-out infinite; }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-3px); }
      }
    </style>
  </defs>

  <!-- Base illustration -->
  <image href="footer.jpeg" x="0" y="0" width="554" height="554"/>

  <!-- Machine steam wisps -->
  <g class="s1"><path d="M196,118 Q191,106 196,94 Q201,82 196,70" fill="none" stroke="#444" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/></g>
  <g class="s2"><path d="M210,118 Q216,104 210,90 Q204,76 210,64" fill="none" stroke="#444" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/></g>
  <g class="s3"><path d="M224,118 Q219,106 224,94 Q229,82 224,70" fill="none" stroke="#444" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/></g>

  <!-- Cup steam -->
  <g class="cs1"><path d="M350,292 Q346,280 350,268 Q354,256 350,244" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" opacity="0.6"/></g>
  <g class="cs2"><path d="M364,292 Q368,278 364,266 Q360,254 364,242" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" opacity="0.6"/></g>

  <!-- Barista arm -->
  <g class="ba">
    <path d="M180,292 Q200,285 220,280 Q234,276 244,272" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <path d="M180,292 Q200,285 220,280 Q234,276 244,272" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    <circle cx="246" cy="271" r="9" fill="white" stroke="#111" stroke-width="2.5"/>
  </g>

  <!-- Man sipping arm -->
  <g class="ma">
    <path d="M298,390 Q316,368 338,352 Q350,342 364,336" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <path d="M298,390 Q316,368 338,352 Q350,342 364,336" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Staff wave arm -->
  <g class="wa">
    <path d="M436,280 Q448,258 458,238 Q464,222 468,210" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <path d="M436,280 Q448,258 458,238 Q464,222 468,210" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <circle cx="470" cy="207" r="8" fill="white" stroke="#111" stroke-width="2" opacity="0.9"/>
  </g>

  <!-- Barista eyes -->
  <g class="eb bg">
    <ellipse cx="132" cy="163" rx="5" ry="5" fill="#111"/>
    <ellipse cx="150" cy="162" rx="5" ry="5" fill="#111"/>
  </g>

  <!-- Seated man eyes -->
  <g class="eb2">
    <ellipse cx="280" cy="228" rx="4.5" ry="4.5" fill="#111"/>
    <ellipse cx="300" cy="228" rx="4.5" ry="4.5" fill="#111"/>
  </g>

  <!-- Woman eyes -->
  <g class="eb3">
    <ellipse cx="364" cy="210" rx="4" ry="4" fill="#111"/>
    <ellipse cx="382" cy="210" rx="4" ry="4" fill="#111"/>
  </g>

</svg>
